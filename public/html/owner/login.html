<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Check if we're on a local server (using a different variable name than base-url.js)
        const _isLocalServer = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname.includes('192.168.') || 
                            window.location.hostname.includes('10.0.');
        
        console.log("Server detection (inline):", _isLocalServer ? "LOCAL SERVER" : "PRODUCTION SERVER");
        
        // Resource paths - choosing between local path and production path
        const baseUrlJsPath = _isLocalServer ? "../../js/base-url.js" : "/public/js/base-url.js";
        const authCssPath = _isLocalServer ? "../../css/owner/auth.css" : "/public/css/owner/auth.css";
        const loginJsPath = _isLocalServer ? "../../js/owner/login.js" : "/public/js/owner/login.js";
        
        // Create and append base URL script
        document.write(`<script src="${baseUrlJsPath}"><\/script>`);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Owner Login | StudySimplify</title>
    <script>
        document.write(`<link rel="stylesheet" href="${authCssPath}">`);
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Tuition Owner Login</h1>
                <p>Login to manage your tuition class portal</p>
            </div>
            
            <div id="error-message" class="error-message">
                <span class="error-icon"><i class="fas fa-exclamation-circle"></i></span>
                <span class="error-text">Error message goes here</span>
            </div>
            
            <form id="ownerLoginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field-container">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                        <i class="toggle-password fas fa-eye-slash" id="togglePassword"></i>
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; margin-top: -10px;">
                    <div class="remember-me" style="display: flex; align-items: center;">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe" style="margin-left: 8px; margin-bottom: 0;">Remember me</label>
                    </div>
                </div>
                
                <button type="submit" class="btn">Login</button>
            </form>
            
            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up here</a>
            </div>
        </div>
    </div>
    
    <script>
        document.write(`<script src="${loginJsPath}"><\/script>`);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Owner Signup | StudySimplify</title>
    <link rel="stylesheet" href="../../css/owner/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../js/base-url.js"></script>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Tuition Owner Signup</h1>
                <p>Create an account to manage your tuition class portal</p>
            </div>
            
            <div id="error-message" class="error-message">
                <span class="error-icon"><i class="fas fa-exclamation-circle"></i></span>
                <span class="error-text">Error message goes here</span>
            </div>
            
            <form id="ownerSignupForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="className">Tuition Class Name</label>
                    <input type="text" id="className" name="className" class="form-control" placeholder="Enter your tuition class name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="phoneNumber">Phone Number (Optional)</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" placeholder="Enter your phone number">
                </div>
                
                <div class="form-group">
                    <label for="subdomainIdentifier">Subdomain Identifier</label>
                    <input type="text" id="subdomainIdentifier" name="subdomainIdentifier" class="form-control" placeholder="e.g., classA" required>
                    <div class="subdomain-preview">Your URL will be: <span id="subdomainPreview">classA</span>.studysimplify.in</div>
                    <div id="subdomainFeedback" class="validation-feedback">Subdomain must contain only letters and numbers with no spaces</div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field-container">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
                        <i class="toggle-password fas fa-eye-slash" id="togglePassword"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-field-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm your password" required>
                        <i class="toggle-password fas fa-eye-slash" id="toggleConfirmPassword"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn">Sign Up</button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>
    
    <script src="../../js/owner/signup.js"></script>
</body>
</html>

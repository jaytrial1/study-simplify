<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Check if we're on a local server (using a different variable name than base-url.js)
        const _isLocalServer = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname.includes('192.168.') || 
                            window.location.hostname.includes('10.0.');
        
        console.log("Server detection (inline):", _isLocalServer ? "LOCAL SERVER" : "PRODUCTION SERVER");
        
        // Resource paths - choosing between local path and production path
        const cssPath = _isLocalServer ? "../css/auth.css" : "/public/css/auth.css";
        const baseUrlJsPath = _isLocalServer ? "../js/base-url.js" : "/public/js/base-url.js";
        const loginJsPath = _isLocalServer ? "../js/login.js" : "/public/js/login.js";
        const manifestPath = _isLocalServer ? "../manifest.json" : "/public/manifest.json";
        const iconPath = _isLocalServer ? "../icons/icon-192x192.png" : "/public/icons/icon-192x192.png";
        
        // Create and append resources
        document.write(`<script src="${baseUrlJsPath}"><\/script>`);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot - Login</title>
    <!-- PWA Support -->
    <script>document.write(`<link rel="manifest" href="${manifestPath}">`)</script>
    <meta name="theme-color" content="#4166d5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>document.write(`<link rel="apple-touch-icon" href="${iconPath}">`)</script>
    <!-- CSS Files -->
    <script>document.write(`<link rel="stylesheet" href="${cssPath}">`)</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        // Check for authentication token on page load
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            const userId = localStorage.getItem('user_id');
            
            // If valid token exists, redirect to chatbot
            if (token && userId) {
                // Optional: You could add a server validation step here
                window.location.href = 'chatbot.html';
            }
            
            // Service worker is now handled in base-url.js
        });
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="fas fa-book-reader"></i>
                <h1>Welcome Back</h1>
                <p>Login to continue to ChatBot</p>
            </div>
            
            <div id="error-message" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span class="error-text"></span>
            </div>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-button">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>
    <script>
        // Load the JavaScript file using the determined path
        document.write(`<script src="${loginJsPath}"><\/script>`);
    </script>
</body>
</html>

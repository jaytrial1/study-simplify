<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Check if we're on a local server (using a different variable name than base-url.js)
        const _isLocalServer = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname.includes('192.168.') || 
                            window.location.hostname.includes('10.0.');
        
        console.log("Server detection (inline):", _isLocalServer ? "LOCAL SERVER" : "PRODUCTION SERVER");
        
        // Resource paths - choosing between local path and production path
        const cssPath = _isLocalServer ? "../css/auth.css" : "/public/css/auth.css";
        const themeCssPath = _isLocalServer ? "../css/theme.css" : "/public/css/theme.css";
        const baseUrlJsPath = _isLocalServer ? "../js/base-url.js" : "/public/js/base-url.js";
        const forgetPasswordJsPath = _isLocalServer ? "../js/forget-password.js" : "/public/js/forget-password.js";
        const manifestPath = _isLocalServer ? "../manifest.json" : "/public/manifest.json";
        const iconPath = _isLocalServer ? "../icons/icon-192x192.png" : "/public/icons/icon-192x192.png";
        
        // Create and append resources
        document.write(`<script src="${baseUrlJsPath}"><\/script>`);

        // --- DYNAMIC THEME CSS LOADING (v2 - Fixed IP handling) --- 
        const currentHostnameTheme = window.location.hostname;
        const isMainDomainProdTheme = currentHostnameTheme === 'studysimplify.in';
        // Check for direct local access (localhost, IP addresses)
        const isDirectLocalAccessTheme = currentHostnameTheme === 'localhost' || 
                                       currentHostnameTheme === '127.0.0.1' ||
                                       currentHostnameTheme.startsWith('192.168.') || 
                                       currentHostnameTheme.startsWith('10.');
        // It's a theme-relevant subdomain ONLY if it's NOT the main production domain AND NOT direct local access.
        const isSubdomainTheme = !isMainDomainProdTheme && !isDirectLocalAccessTheme;
        let finalThemePath;

        if (isSubdomainTheme) {
            // This handles *.studysimplify.in (excluding main) and *.localhost
            const subdomainName = currentHostnameTheme.split('.')[0]; 
            finalThemePath = `/subdomain/${subdomainName}/theme.css`;
            console.log(`Theme Loading: Subdomain detected (${subdomainName}). Path: ${finalThemePath}`);
        } else {
            // This handles main domain, localhost, 127.0.0.1, and local IPs
            // Use the original _isLocalServer check which correctly identifies these as local.
            finalThemePath = _isLocalServer ? "../css/theme.css" : "/public/css/theme.css"; // No PHP time() here
            console.log(`Theme Loading: Not a theme subdomain. Using default. Path: ${finalThemePath}`);
        }
        // --- END DYNAMIC THEME CSS LOADING ---

    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot - Forgot Password</title>
    <!-- PWA Support -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#1e1f24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../icons/icon-192x192.png">
    <!-- CSS Files -->
    <script>
        document.write(`<link rel="stylesheet" href="${cssPath}">`);
        document.write(`<link rel="stylesheet" href="${finalThemePath}">`);
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Additional styles for steps */
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            position: relative;
        }
        
        .step-indicator::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e0e0e0;
            z-index: 1;
        }
        
        .step {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
            z-index: 2;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .step.active {
            background-color: #4166d5;
            color: white;
        }
        
        .step.completed {
            background-color: #4CAF50;
            color: white;
        }
        
        .step-container {
            display: none;
        }
        
        .step-container.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .otp-input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .otp-input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 24px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="fas fa-key"></i>
                <h1>Reset Password</h1>
                <p>Follow the steps to reset your password</p>
            </div>
            
            <div id="error-message" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span class="error-text"></span>
            </div>
            
            <div id="success-message" style="display: none; color: green; text-align: center; margin-bottom: 15px;">
                <i class="fas fa-check-circle"></i>
                <span class="success-text"></span>
            </div>
            
            <div class="step-indicator">
                <div class="step active" id="step-1">1</div>
                <div class="step" id="step-2">2</div>
                <div class="step" id="step-3">3</div>
            </div>
            
            <!-- Step 1: Email Input -->
            <div class="step-container active" id="step-1-container">
                <form class="auth-form" id="emailForm">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
                    </div>
                    
                    <button type="submit" class="auth-button">
                        <i class="fas fa-paper-plane"></i> Send OTP
                    </button>
                </form>
            </div>
            
            <!-- Step 2: OTP Verification -->
            <div class="step-container" id="step-2-container">
                <p class="text-center">We've sent a verification code to your email</p>
                <form class="auth-form" id="otpForm">
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Enter 6-digit OTP</label>
                        <div class="otp-input-group">
                            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                        </div>
                        <input type="hidden" id="otpValue" name="otp">
                        <input type="hidden" id="emailValue" name="email">
                        <p id="resendText" class="text-center">Didn't receive the code? <a href="#" id="resendLink">Resend OTP</a></p>
                    </div>
                    
                    <button type="submit" class="auth-button">
                        <i class="fas fa-check-circle"></i> Verify OTP
                    </button>
                </form>
            </div>
            
            <!-- Step 3: New Password -->
            <div class="step-container" id="step-3-container">
                <form class="auth-form" id="passwordForm">
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> New Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter new password" required>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
                    </div>
                    
                    <input type="hidden" id="passwordEmailValue" name="email">
                    <input type="hidden" id="passwordOtpValue" name="otp">
                    
                    <button type="submit" class="auth-button">
                        <i class="fas fa-save"></i> Reset Password
                    </button>
                </form>
            </div>
            
            <div class="auth-footer">
                <p>Remember your password? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>
    <script>
        // Load the JavaScript file using the determined path
        document.write(`<script src="${forgetPasswordJsPath}"><\/script>`);
    </script>
    
    <!-- Active User Tracking Script -->
    <script>
    // Auto-detect server environment and load the appropriate script
    (function() {
        // Determine if we're in production or local
        const isProduction = !(
            window.location.hostname === 'localhost' || 
            window.location.hostname === '127.0.0.1' || 
            window.location.hostname.startsWith('192.168.') ||
            window.location.hostname.includes('.local')
        );
        
        // Get the base path (main folder detection)
        const getBasePath = () => {
            const pathParts = window.location.pathname.split('/');
            if (pathParts.length > 1 && pathParts[1] === 'main') {
                return '/main';
            }
            return '';
        };
        
        // Construct the correct script URL based on environment
        const basePath = getBasePath();
        const scriptPath = isProduction 
            ? '/active-users/js/tracker.js' 
            : basePath + '/active-users/js/tracker.js';
        
        // Create and append the script element
        const script = document.createElement('script');
        script.src = scriptPath;
        script.async = true;
        
        // Add the script to the document
        document.body.appendChild(script);
    })();
    </script>
    <!-- End Active User Tracking Script -->
</body>
</html>

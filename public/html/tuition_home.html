<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#4166d5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="../js/base-url.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/intermediate.css">
    <style>
        /* Toast message styles */
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 2px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 17px;
        }
        .toast.show {
            visibility: visible;
            -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @-webkit-keyframes fadein {
            from {bottom: 0; opacity: 0;} 
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @-webkit-keyframes fadeout {
            from {bottom: 30px; opacity: 1;} 
            to {bottom: 0; opacity: 0;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;} 
            to {bottom: 0; opacity: 0;}
        }
        
        /* Logout button styles */
        .logout-btn {
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        .logout-btn:hover {
            background-color: #d32f2f;
        }
        
        .logout-btn i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="intermediate-container">
        <div class="intermediate-box">
            <div class="header">
                <img id="tuition-logo" src="" alt="Tuition Logo" class="logo-img">
                <h1 id="tuition-name">Welcome</h1>
                <p>Choose where you want to go:</p>
            </div>
            <div class="options">
                <button id="chatbot-btn" class="option-button">
                    <i class="fas fa-comments"></i>
                    <span>Go to Chatbot</span>
                </button>
                <button id="broadcast-btn" class="option-button">
                    <i class="fas fa-bullhorn"></i>
                    <span>Go to Broadcast</span>
                </button>
                <button id="logout-btn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Broadcast feature is under construction.</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tuitionClass = localStorage.getItem('tuitionClass');
            const userId = localStorage.getItem('user_id');
            const token = localStorage.getItem('token');
            const tuitionName = document.getElementById('tuition-name');
            const tuitionLogo = document.getElementById('tuition-logo');
            
            // --- DEBUG LOGGING ---
            console.log("Current hostname:", window.location.hostname);
            console.log("Current pathname:", window.location.pathname);
            console.log("localStorage tuitionClass:", tuitionClass);
            console.log("localStorage userId:", userId);
            
            // --- Branding Logic (similar to index.html but for PHP config) ---
            const logoUrl = `/subdomain/${tuitionClass}/logo.png`; // Assuming logo.png exists
            tuitionLogo.src = logoUrl;
            tuitionLogo.alt = `${tuitionClass} Logo`; // Improve alt text
            
            // You might want to fetch the actual tuition name from a config file later
            // For now, use the tuitionClass value
            tuitionName.textContent = `Welcome to ${tuitionClass.charAt(0).toUpperCase() + tuitionClass.slice(1)}`;

            // --- Button Actions ---
            document.getElementById('chatbot-btn').addEventListener('click', async () => {
                // Get the current hostname
                const currentHostname = window.location.hostname;
                
                // Check if we're on a subdomain of studysimplify.in
                const isSubdomain = currentHostname.includes('.studysimplify.in') && 
                                   currentHostname !== 'studysimplify.in';
                
                console.log("Current hostname:", currentHostname);
                console.log("Is actual subdomain:", isSubdomain);
                
                // Only check approval status if we're actually on a subdomain
                if (isSubdomain && tuitionClass && tuitionClass !== 'null' && tuitionClass !== '') {
                    try {
                        // Get the same base path we use elsewhere
                        const host = window.location.hostname;
                        const currentPath = window.location.pathname;
                        
                        // Determine if we're on a subdomain
                        console.log("Is subdomain?", isSubdomain);
                        
                        // For subdomains, we need a different path construction
                        let apiEndpoint;
                        
                        if (isSubdomain) {
                            // Check if the URL structure indicates we're in the main directory or not
                            const inMainDir = currentPath.startsWith('/main/');
                            console.log("In /main/ directory?", inMainDir);
                            
                            // Try different path constructions for subdomains
                            const protocol = window.location.protocol;
                            
                            // Option 1: Direct to root
                            apiEndpoint = `${protocol}//studysimplify.in/api/user/check_status.php`;
                            console.log("Using main domain API endpoint:", apiEndpoint);
                        } else {
                            // Regular domain path construction
                            let basePath = '/main'; // Default subfolder
                            
                            // Try to extract the base path from the current URL
                            const pathMatch = currentPath.match(/^\/([^\/]+)/);
                            if (pathMatch && pathMatch[1]) {
                                basePath = '/' + pathMatch[1];
                            }
                            
                            // Construct the API endpoint to check user status
                            const protocol = (host === 'localhost' || host.startsWith('192.168.') || host.startsWith('10.') || host.startsWith('172.16.')) ? 'http:' : window.location.protocol;
                            apiEndpoint = `${protocol}//${host}${basePath}/api/user/check_status.php`;
                            console.log("Using regular API endpoint:", apiEndpoint);
                        }
                        
                        console.log("Sending request to:", apiEndpoint);
                        console.log("Request data:", JSON.stringify({
                            user_id: userId,
                            tuition_class: tuitionClass
                        }));
                        
                        const response = await fetch(apiEndpoint, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                user_id: userId,
                                tuition_class: tuitionClass
                            })
                        });
                        
                        console.log("Response status:", response.status);
                        
                        if (response.ok) {
                            const responseText = await response.text();
                            console.log("Raw response:", responseText);
                            
                            // Try to parse as JSON
                            let data;
                            try {
                                data = JSON.parse(responseText);
                                console.log("Parsed response data:", data);
                                console.log("is_approved_by_owner value:", data.is_approved_by_owner, "type:", typeof data.is_approved_by_owner);
                                console.log("is_active_by_owner value:", data.is_active_by_owner, "type:", typeof data.is_active_by_owner);
                                console.log("is_active_by_admin value:", data.is_active_by_admin, "type:", typeof data.is_active_by_admin);
                                
                                // Check if approved and active by both owner and admin (using integer '1' comparison)
                                if (data.is_approved_by_owner == 1 && data.is_active_by_owner == 1 && data.is_active_by_admin == 1) {
                                    // Store approval status in localStorage for chatbot.html to check
                                    localStorage.setItem('is_approved_by_owner', data.is_approved_by_owner);
                                    localStorage.setItem('is_active_by_owner', data.is_active_by_owner);
                                    localStorage.setItem('is_active_by_admin', data.is_active_by_admin);
                                    
                                    window.location.href = 'chatbot.html';
                                } else {
                                    // Clear any previous approval status
                                    localStorage.removeItem('is_approved_by_owner');
                                    localStorage.removeItem('is_active_by_owner');
                                    localStorage.removeItem('is_active_by_admin');
                                    
                                    const toast = document.getElementById('toast');
                                    
                                    // Customize error message based on what failed
                                    if (data.is_active_by_admin != 1) {
                                        toast.textContent = "Access to this service has been temporarily suspended by the administrator. Please contact your class teacher.";
                                    } else {
                                        toast.textContent = "Please contact your class teacher to activate your plan.";
                                    }
                                    
                                    toast.classList.add('show');
                                    setTimeout(() => { toast.classList.remove('show'); }, 3000);
                                }
                            } catch (e) {
                                console.error("Error parsing JSON:", e);
                                const toast = document.getElementById('toast');
                                toast.textContent = "Error processing server response. Please try again.";
                                toast.classList.add('show');
                                setTimeout(() => { toast.classList.remove('show'); }, 3000);
                            }
                        } else {
                            // If API request fails, show error message instead of redirecting
                            console.error('Failed to check user status. Status code:', response.status);
                            const toast = document.getElementById('toast');
                            
                            // Try to get error details from response
                            try {
                                const errorText = await response.text();
                                console.log("Error response:", errorText);
                                
                                let errorMessage = "Unable to verify your access. Please try again or contact support.";
                                
                                // Try to parse the error response
                                try {
                                    const errorData = JSON.parse(errorText);
                                    if (errorData.error) {
                                        console.log("Server error message:", errorData.error);
                                        
                                        if (response.status === 404) {
                                            errorMessage = "Your account was not found in this tuition class. Please contact your teacher.";
                                        } else if (response.status === 500) {
                                            errorMessage = "The server encountered an error. Please try again later.";
                                        }
                                    }
                                } catch(e) {
                                    console.error("Error parsing error response:", e);
                                }
                                
                                toast.textContent = errorMessage;
                            } catch(e) {
                                toast.textContent = "Unable to verify your access. Status: " + response.status;
                            }
                            
                            toast.classList.add('show');
                            setTimeout(() => { toast.classList.remove('show'); }, 5000); // Show for longer time
                        }
                    } catch (error) {
                        console.error('Error checking user status:', error);
                        const toast = document.getElementById('toast');
                        toast.textContent = "An error occurred. Please try again or contact support.";
                        toast.classList.add('show');
                        setTimeout(() => { toast.classList.remove('show'); }, 3000);
                    }
                } else {
                    // Main domain user (or no tuition class), directly go to chatbot
                window.location.href = 'chatbot.html';
                }
            });

            document.getElementById('broadcast-btn').addEventListener('click', () => {
                const toast = document.getElementById('toast');
                toast.textContent = "Broadcast feature is under construction.";
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 3000);
            });

            // Add logout functionality
            document.getElementById('logout-btn').addEventListener('click', async () => {
                try {
                    const token = localStorage.getItem('token');
                    // Call the logout API (optional - continue with client-side logout even if this fails)
                    try {
                        const host = window.location.hostname;
                        const isSubdomain = host.includes('.studysimplify.in');
                        const protocol = window.location.protocol;
                        
                        let logoutEndpoint;
                        
                        if (isSubdomain) {
                            // Use main domain for API endpoint
                            logoutEndpoint = `${protocol}//studysimplify.in/api/auth/logout.php`;
                        } else {
                            // Regular domain path construction
                            logoutEndpoint = `${protocol}//${host}${basePath}/api/auth/logout.php`;
                        }
                        
                        const response = await fetch(logoutEndpoint, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`
                            }
                        });
                    } catch (apiError) {
                        console.warn('Server logout request failed, proceeding with client-side cleanup.');
                    }
                    
                    // Clear all user-related data from localStorage
                    localStorage.removeItem('token');
                    localStorage.removeItem('user_id');
                    localStorage.removeItem('userGrade');
                    localStorage.removeItem('tuitionClass');
                    localStorage.removeItem('savedCredentials');
                    localStorage.removeItem('is_approved_by_owner');
                    localStorage.removeItem('is_active_by_owner');
                    localStorage.removeItem('is_active_by_admin');
                    
                    // Redirect to login page
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('Error during logout:', error);
                    
                    // Still clear localStorage and redirect even if there's an error
                    localStorage.removeItem('token');
                    localStorage.removeItem('user_id');
                    localStorage.removeItem('userGrade');
                    localStorage.removeItem('tuitionClass');
                    localStorage.removeItem('savedCredentials');
                    localStorage.removeItem('is_approved_by_owner');
                    localStorage.removeItem('is_active_by_owner');
                    localStorage.removeItem('is_active_by_admin');
                    
                    window.location.href = 'login.html';
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="manifest" href="../generate_manifest.php">
    <meta name="theme-color" content="#1e1f24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        // Check if we're on a local server
        const _isLocalServer = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname.includes('192.168.') || 
                            window.location.hostname.includes('10.0.');
        
        // Resource paths - choosing between local path and production path
        const baseUrlJsPath = _isLocalServer ? "../js/base-url.js" : "/public/js/base-url.js";
        const intermediateCssPath = _isLocalServer ? "../css/intermediate.css" : "/public/css/intermediate.css";
        // const themeCssPath = _isLocalServer ? "../css/theme.css" : "/public/css/theme.css"; // Old theme path removed
        
        // Create and append resources
        document.write(`<script src="${baseUrlJsPath}"><\/script>`);
        document.write(`<link rel="stylesheet" href="${intermediateCssPath}">`);
        // Link styles.css for splash screen styles - REMOVED
        // const stylesPath = _isLocalServer ? "../css/styles.css" : "/public/css/styles.css";
        // document.write(`<link rel="stylesheet" href="${stylesPath}">`);

        // --- DYNAMIC THEME CSS LOADING (v2 - Fixed IP handling) --- 
        const currentHostnameTheme = window.location.hostname;
        const isMainDomainProdTheme = currentHostnameTheme === 'studysimplify.in';
        // Check for direct local access (localhost, IP addresses)
        const isDirectLocalAccessTheme = currentHostnameTheme === 'localhost' || 
                                       currentHostnameTheme === '127.0.0.1' ||
                                       currentHostnameTheme.startsWith('192.168.') || 
                                       currentHostnameTheme.startsWith('10.');
        // It's a theme-relevant subdomain ONLY if it's NOT the main production domain AND NOT direct local access.
        const isSubdomainTheme = !isMainDomainProdTheme && !isDirectLocalAccessTheme;
        let finalThemePath;

        if (isSubdomainTheme) {
            // This handles *.studysimplify.in (excluding main) and *.localhost
            const subdomainName = currentHostnameTheme.split('.')[0]; 
            finalThemePath = `/subdomain/${subdomainName}/theme.css`;
            console.log(`Theme Loading: Subdomain detected (${subdomainName}). Path: ${finalThemePath}`);
        } else {
            // This handles main domain, localhost, 127.0.0.1, and local IPs
            // Use the original _isLocalServer check which correctly identifies these as local.
            finalThemePath = _isLocalServer ? "../css/theme.css" : "/public/css/theme.css"; // No PHP time() here
            console.log(`Theme Loading: Not a theme subdomain. Using default. Path: ${finalThemePath}`);
        }
        document.write(`<link rel="stylesheet" href="${finalThemePath}">`); // Load dynamic theme path
        // --- END DYNAMIC THEME CSS LOADING ---

    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Toast message styles */
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 2px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 17px;
        }
        .toast.show {
            visibility: visible;
            -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @-webkit-keyframes fadein {
            from {bottom: 0; opacity: 0;} 
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @-webkit-keyframes fadeout {
            from {bottom: 30px; opacity: 1;} 
            to {bottom: 0; opacity: 0;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;} 
            to {bottom: 0; opacity: 0;}
        }
        
        /* Logout button styles */
        .logout-btn {
            background-color: var(--color-danger);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        .logout-btn:hover {
            background-color: #d32f2f;
        }
        
        .logout-btn i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <!-- PWA Splash Screen - REMOVED -->
    <!-- <div class="splash-screen" id="splash-screen"> ... </div> -->

    <div class="intermediate-container">
        <div class="intermediate-box">
            <div class="header">
                <img id="tuition-logo" src="" alt="Tuition Logo" class="logo-img">
                <h1 id="tuition-name">Welcome</h1>
                <p>Choose where you want to go:</p>
            </div>
            <div class="options">
                <button id="chatbot-btn" class="option-button">
                    <i class="fas fa-comments"></i>
                    <span>Go to Chatbot</span>
                </button>
                <button id="broadcast-btn" class="option-button">
                    <i class="fas fa-bullhorn"></i>
                    <span>Go to Broadcast</span>
                </button>
                <button id="logout-btn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Broadcast feature is under construction.</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tuitionClass = localStorage.getItem('tuitionClass');
            const userId = localStorage.getItem('user_id');
            const token = localStorage.getItem('token');
            
            // --- IMMEDIATE LOGIN CHECK --- 
            // If token or user_id is missing, redirect to login immediately
            if (!token || !userId) {
                console.log('Token or User ID missing from localStorage. Redirecting to login.');
                window.location.href = 'login.html';
                return; // Stop further execution of this script block
            }
            // --- END IMMEDIATE LOGIN CHECK ---
            
            const tuitionName = document.getElementById('tuition-name');
            const tuitionLogo = document.getElementById('tuition-logo');
            
            // --- DEBUG LOGGING ---
            console.log("Current hostname:", window.location.hostname);
            console.log("Current pathname:", window.location.pathname);
            console.log("localStorage tuitionClass:", tuitionClass);
            console.log("localStorage userId:", userId);
            
            // --- Enhanced Branding Logic --- 
            if (tuitionClass && tuitionClass !== 'null' && tuitionClass !== '') {
                const cleanTuitionName = tuitionClass.charAt(0).toUpperCase() + tuitionClass.slice(1);
                const fallbackWelcome = `Welcome to ${cleanTuitionName}`;

                // --- Fetch App Name --- 
                const appNameUrl = `/subdomain/${tuitionClass}/app_name.txt`;
                console.log(`Fetching app name from: ${appNameUrl}`);
                fetch(appNameUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(text => {
                        const appName = text.trim();
                        if (appName) {
                            tuitionName.textContent = appName; // Use fetched app name
                            console.log(`Using app name from file: ${appName}`);
                        } else {
                            tuitionName.textContent = fallbackWelcome; // Fallback if file is empty
                            console.warn(`app_name.txt found but empty. Using fallback welcome: ${fallbackWelcome}`);
                        }
                    })
                    .catch(error => {
                        console.error(`Error fetching app_name.txt: ${error}. Using fallback welcome: ${fallbackWelcome}`);
                        tuitionName.textContent = fallbackWelcome; // Fallback on fetch error
                    });
                // --- End Fetch App Name ---

                // Construct logo URL (assuming logo.png)
                const logoUrl = `/subdomain/${tuitionClass}/logo.png`;
            tuitionLogo.src = logoUrl;
                tuitionLogo.alt = `${cleanTuitionName} Logo`;

                // Add error handling for the logo
                tuitionLogo.onerror = function() {
                    console.warn(`Logo not found at ${logoUrl}. Hiding logo element.`);
                    this.style.display = 'none'; // Hide the image element if logo fails to load
                    // Optionally, try logo.jpg here: 
                    // this.onerror = null; // Prevent infinite loop if jpg also fails
                    // this.src = `/subdomain/${tuitionClass}/logo.jpg`; 
                };
                
                console.log(`Set logo src to: ${logoUrl}`);
            } else {
                // Fallback if tuitionClass isn't set (though unlikely for this page)
                tuitionName.textContent = 'Welcome';
                tuitionLogo.style.display = 'none'; // Hide logo if no class
                console.warn('tuitionClass not found in localStorage. Hiding logo.');
            }

            // --- Button Actions ---
            document.getElementById('chatbot-btn').addEventListener('click', async () => {
                // Get the current hostname
                const currentHostname = window.location.hostname;
                
                // Check if we're on a subdomain (either production or local testing)
                const isProductionSubdomain = currentHostname.includes('.studysimplify.in') && 
                                   currentHostname !== 'studysimplify.in' && 
                                   currentHostname !== 'www.studysimplify.in';
                
                const isLocalSubdomain = currentHostname.includes('.localhost');
                
                // Combined subdomain check
                const isSubdomain = isProductionSubdomain || isLocalSubdomain;
                
                console.log("Current hostname:", currentHostname);
                console.log("Is actual subdomain:", isSubdomain, "(production:", isProductionSubdomain, ", local:", isLocalSubdomain, ")");
                
                // Only check approval status if we're actually on a subdomain
                if (isSubdomain && tuitionClass && tuitionClass !== 'null' && tuitionClass !== '') {
                    try {
                        // Get the same base path we use elsewhere
                        const host = window.location.hostname;
                        const currentPath = window.location.pathname;
                        
                        // Determine if we're on a subdomain
                        console.log("Is subdomain?", isSubdomain);
                        
                        // For subdomains, we need a different path construction
                        let apiEndpoint;
                        
                        if (isSubdomain) {
                            // Production subdomain: use the main domain for API endpoint
                            if (isProductionSubdomain) {
                            const protocol = window.location.protocol;
                            apiEndpoint = `${protocol}//studysimplify.in/api/user/check_status.php`;
                            console.log("Using main domain API endpoint:", apiEndpoint);
                            }
                            // Local subdomain: path is relative to subdomain's root (which is likely the 'main' folder)
                            else if (isLocalSubdomain) {
                                // ---- CORRECTED LOCAL SUBDOMAIN LOGIC (v2) ----
                                const basePath = ''; // NO /main prefix needed relative to the subdomain host
                                const protocol = (host === 'localhost' || host.includes('.localhost') || 
                                               host.startsWith('192.168.') || host.startsWith('10.') || 
                                               host.startsWith('172.16.')) ? 'http:' : window.location.protocol;
                                
                                // Construct API endpoint relative to the *subdomain host* WITHOUT /main
                                apiEndpoint = `${protocol}//${host}${basePath}/api/user/check_status.php`;
                                console.log("Using corrected local subdomain API endpoint (no /main):", apiEndpoint);
                                // ---- END CORRECTION ----
                            }
                        } else {
                            // Regular domain path construction (Direct localhost or 127.0.0.1 access)
                            let basePath = '/main'; // Use /main for direct localhost
                            
                            // Construct the API endpoint to check user status
                            const protocol = (host === 'localhost' || host.startsWith('192.168.') || host.startsWith('10.') || host.startsWith('172.16.')) ? 'http:' : window.location.protocol;
                            apiEndpoint = `${protocol}//${host}${basePath}/api/user/check_status.php`;
                            console.log("Using regular API endpoint (direct localhost):", apiEndpoint);
                        }
                        
                        console.log("Sending request to:", apiEndpoint);
                        console.log("Request data:", JSON.stringify({
                            user_id: userId,
                            tuition_class: tuitionClass
                        }));
                        
                        const response = await fetch(apiEndpoint, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                user_id: userId,
                                tuition_class: tuitionClass
                            })
                        });
                        
                        console.log("Response status:", response.status);
                        
                        if (response.ok) {
                            const responseText = await response.text();
                            console.log("Raw response:", responseText);
                            
                            // Try to parse as JSON
                            let data;
                            try {
                                data = JSON.parse(responseText);
                                console.log("Parsed response data:", data);
                                console.log("is_approved_by_owner value:", data.is_approved_by_owner, "type:", typeof data.is_approved_by_owner);
                                console.log("is_active_by_owner value:", data.is_active_by_owner, "type:", typeof data.is_active_by_owner);
                                console.log("is_active_by_admin value:", data.is_active_by_admin, "type:", typeof data.is_active_by_admin);
                                
                                // Check if approved and active by both owner and admin (using integer '1' comparison)
                                if (data.is_approved_by_owner == 1 && data.is_active_by_owner == 1 && data.is_active_by_admin == 1) {
                                    // Store approval status in localStorage for chatbot.html to check
                                    localStorage.setItem('is_approved_by_owner', data.is_approved_by_owner);
                                    localStorage.setItem('is_active_by_owner', data.is_active_by_owner);
                                    localStorage.setItem('is_active_by_admin', data.is_active_by_admin);
                                    
                                    window.location.href = 'chatbot.html';
                                } else {
                                    // Clear any previous approval status
                                    localStorage.removeItem('is_approved_by_owner');
                                    localStorage.removeItem('is_active_by_owner');
                                    localStorage.removeItem('is_active_by_admin');
                                    
                                    const toast = document.getElementById('toast');
                                    
                                    // Customize error message based on what failed
                                    if (data.is_active_by_admin != 1) {
                                        toast.textContent = "Access to this service has been temporarily suspended by the administrator. Please contact your class teacher.";
                                    } else {
                                        toast.textContent = "Please contact your class teacher to activate your plan.";
                                    }
                                    
                                    toast.classList.add('show');
                                    setTimeout(() => { toast.classList.remove('show'); }, 3000);
                                }
                            } catch (e) {
                                console.error("Error parsing JSON:", e);
                                const toast = document.getElementById('toast');
                                toast.textContent = "Error processing server response. Please try again.";
                                toast.classList.add('show');
                                setTimeout(() => { toast.classList.remove('show'); }, 3000);
                            }
                        } else {
                            // If API request fails, show error message instead of redirecting
                            console.error('Failed to check user status. Status code:', response.status);
                            const toast = document.getElementById('toast');
                            
                            // Try to get error details from response
                            try {
                                const errorText = await response.text();
                                console.log("Error response:", errorText);
                                
                                let errorMessage = "Unable to verify your access. Please try again or contact support.";
                                
                                // Try to parse the error response
                                try {
                                    const errorData = JSON.parse(errorText);
                                    if (errorData.error) {
                                        console.log("Server error message:", errorData.error);
                                        
                                        if (response.status === 404) {
                                            errorMessage = "Your account was not found in this tuition class. Please contact your teacher.";
                                        } else if (response.status === 500) {
                                            errorMessage = "The server encountered an error. Please try again later.";
                                        }
                                    }
                                } catch(e) {
                                    console.error("Error parsing error response:", e);
                                }
                                
                                toast.textContent = errorMessage;
                            } catch(e) {
                                toast.textContent = "Unable to verify your access. Status: " + response.status;
                            }
                            
                            toast.classList.add('show');
                            setTimeout(() => { toast.classList.remove('show'); }, 5000); // Show for longer time
                        }
                    } catch (error) {
                        console.error('Error checking user status:', error);
                        const toast = document.getElementById('toast');
                        toast.textContent = "An error occurred. Please try again or contact support.";
                        toast.classList.add('show');
                        setTimeout(() => { toast.classList.remove('show'); }, 3000);
                    }
                } else {
                    // Main domain user (or no tuition class), directly go to chatbot
                window.location.href = 'chatbot.html';
                }
            });

            document.getElementById('broadcast-btn').addEventListener('click', () => {
                const toast = document.getElementById('toast');
                toast.textContent = "Broadcast feature is under construction.";
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 3000);
            });

            // Add logout functionality
            document.getElementById('logout-btn').addEventListener('click', async () => {
                try {
                    const token = localStorage.getItem('token');
                    // Call the logout API (optional - continue with client-side logout even if this fails)
                    try {
                        const host = window.location.hostname;
                        // Check for both production and local subdomains
                        const isProductionSubdomain = host.includes('.studysimplify.in') && 
                                                     host !== 'studysimplify.in' && 
                                                     host !== 'www.studysimplify.in';
                        const isLocalSubdomain = host.includes('.localhost');
                        const isSubdomain = isProductionSubdomain || isLocalSubdomain;
                        
                        const protocol = window.location.protocol;
                        
                        let logoutEndpoint;
                        
                        if (isSubdomain) {
                            // For production subdomain, use main domain API
                            if (isProductionSubdomain) {
                            logoutEndpoint = `${protocol}//studysimplify.in/api/auth/logout.php`;
                            } 
                            // For local subdomain, use proper path construction
                            else if (isLocalSubdomain) {
                                // Extract the base path from the current URL
                                const currentPath = window.location.pathname;
                                let basePath = '/main'; // Default subfolder
                                
                                const pathMatch = currentPath.match(/^\/([^\/]+)/);
                                if (pathMatch && pathMatch[1]) {
                                    basePath = '/' + pathMatch[1];
                                }
                                
                                logoutEndpoint = `${protocol}//${host}${basePath}/api/auth/logout.php`;
                            }
                        } else {
                            // Regular domain path construction (non-subdomain)
                            const currentPath = window.location.pathname;
                            let basePath = '/main'; // Default subfolder
                            
                            const pathMatch = currentPath.match(/^\/([^\/]+)/);
                            if (pathMatch && pathMatch[1]) {
                                basePath = '/' + pathMatch[1];
                            }
                            
                            logoutEndpoint = `${protocol}//${host}${basePath}/api/auth/logout.php`;
                        }
                        
                        const response = await fetch(logoutEndpoint, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`
                            }
                        });
                    } catch (apiError) {
                        console.warn('Server logout request failed, proceeding with client-side cleanup.');
                    }
                    
                    // Clear all user-related data from localStorage
                    localStorage.removeItem('token');
                    localStorage.removeItem('user_id');
                    localStorage.removeItem('userGrade');
                    localStorage.removeItem('tuitionClass');
                    localStorage.removeItem('savedCredentials');
                    localStorage.removeItem('is_approved_by_owner');
                    localStorage.removeItem('is_active_by_owner');
                    localStorage.removeItem('is_active_by_admin');
                    
                    // Redirect to login page
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('Error during logout:', error);
                    
                    // Still clear localStorage and redirect even if there's an error
                    localStorage.removeItem('token');
                    localStorage.removeItem('user_id');
                    localStorage.removeItem('userGrade');
                    localStorage.removeItem('tuitionClass');
                    localStorage.removeItem('savedCredentials');
                    localStorage.removeItem('is_approved_by_owner');
                    localStorage.removeItem('is_active_by_owner');
                    localStorage.removeItem('is_active_by_admin');
                    
                    window.location.href = 'login.html';
                }
            });
        });
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Check if we're on a local server (using a different variable name than base-url.js)
        const _isLocalServer = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname.includes('192.168.') || 
                            window.location.hostname.includes('10.0.');
        
        console.log("Server detection (inline):", _isLocalServer ? "LOCAL SERVER" : "PRODUCTION SERVER");
        
        // Resource paths - choosing between local path and production path
        const baseUrlJsPath = _isLocalServer ? "../js/base-url.js" : "/public/js/base-url.js";
        
        // CSS paths
        const stylesPath = _isLocalServer ? "../css/styles.css" : "/public/css/styles.css";
        const authPath = _isLocalServer ? "../css/auth.css" : "/public/css/auth.css";
        const settingsPath = _isLocalServer ? "../css/settings.css" : "/public/css/settings.css";
        
        // JavaScript paths
        const settingsJsPath = _isLocalServer ? "../js/settings.js" : "/public/js/settings.js";
        const historySearchPath = _isLocalServer ? "../js/history-search.js" : "/public/js/history-search.js";
        
        // Create and append base URL script
        document.write(`<script src="${baseUrlJsPath}"><\/script>`);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#4166d5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../icons/icon-192x192.png">
    <script>
        document.write(`<link rel="stylesheet" href="${stylesPath}">`);
        document.write(`<link rel="stylesheet" href="${authPath}">`);
        document.write(`<link rel="stylesheet" href="${settingsPath}">`);
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <button class="new-chat-btn">
                    <i class="fas fa-plus"></i> New Chat
                </button>
                
                <nav class="sidebar-nav">
                    <a href="chatbot.html" class="nav-button">
                        <i class="fas fa-robot"></i>
                        <span>Chat Bot</span>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </a>
                    <a href="saved_answers.html" class="nav-button">
                        <i class="fas fa-bookmark"></i>
                        <span>Saved Answers</span>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </a>
                    <a href="settings.html" class="nav-button active">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </a>
                    <a href="tuition_home.html" class="nav-button" id="tuitionClassesBtn" style="display:none;">
                        <i class="fas fa-school"></i>
                        <span>Tuition Classes</span>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </a>
                </nav>
                
                <div class="chat-history">
                    <div class="history-header">
                        <h3>Chat History</h3>
                    </div>

                    <div class="chat-history-redirect">
                        <p>View your chat history in the Chatbot section</p>
                        <a href="chatbot.html" class="history-redirect-btn">
                            <i class="fas fa-history"></i>
                            Go to Chat History
                        </a>
                    </div>
                </div>
                
                <div class="sidebar-bottom">
                    <a href="settings.html" class="settings-btn active">
                        <i class="fas fa-cog"></i>
                        Settings
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="settings-container">
            <div class="chat-header">
                <button id="menuToggle" class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h2><i class="fas fa-cog"></i> Settings</h2>
            </div>

            <!-- Settings Form -->
            <div class="settings-content">
                <div class="auth-container">
                    <!-- Profile Settings Box -->
                    <div class="auth-box">
                        <div class="auth-header">
                            <i class="fas fa-user-cog"></i>
                            <h1>Profile Settings</h1>
                            <p>Manage your account settings</p>
                        </div>
                        
                        <div id="error-message" class="error-message">
                            <i class="fas fa-exclamation-circle"></i>
                            <span class="error-text"></span>
                        </div>
                        
                        <form class="auth-form" id="settingsForm">
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Full Name</label>
                                <input type="text" id="name" name="name" placeholder="Your full name" disabled required>
                            </div>

                            <div class="form-group">
                                <label><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" id="email" name="email" placeholder="Your email" disabled required>
                            </div>

                            <div class="form-group">
                                <label for="grade-level">
                                    <i class="fas fa-graduation-cap"></i>
                                    Grade Level
                                </label>
                                <select class="form-input" id="grade-level" name="grade" disabled required>
                                    <!-- Dynamic options will be inserted here -->
                                </select>
                            </div>

                            <button type="button" id="editButton" class="auth-button">
                                <i class="fas fa-edit"></i> Edit Profile
                            </button>

                            <button type="submit" id="saveButton" class="auth-button" style="display: none;">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                        </form>
                    </div>

                    <!-- Password Change Box -->
                    <div class="auth-box">
                        <div class="auth-header">
                            <i class="fas fa-lock"></i>
                            <h1>Change Password</h1>
                            <p>Update your account password</p>
                        </div>
                        
                        <div id="password-error" class="error-message">
                            <i class="fas fa-exclamation-circle"></i>
                            <span class="error-text"></span>
                        </div>
                        
                        <form class="auth-form" id="passwordForm">
                            <div class="form-group">
                                <label><i class="fas fa-lock"></i> Current Password</label>
                                <input type="password" id="currentPassword" required>
                            </div>
                            
                            <div class="form-group" id="newPasswordGroup" style="display: none;">
                                <label><i class="fas fa-key"></i> New Password</label>
                                <input type="password" id="newPassword">
                            </div>
                            
                            <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                                <label><i class="fas fa-key"></i> Confirm New Password</label>
                                <input type="password" id="confirmNewPassword">
                            </div>

                            <button type="submit" class="auth-button">
                                <i class="fas fa-sync-alt"></i> Change Password
                            </button>
                        </form>
                    </div>

                    <!-- Logout Box -->
                    <div class="auth-box">
                        <div class="auth-header">
                            <i class="fas fa-sign-out-alt"></i>
                            <h1>Account Actions</h1>
                        </div>
                        <button class="auth-button logout-button" id="logoutButton">
                            <i class="fas fa-power-off"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load JavaScript files using the determined paths
        document.write(`<script src="${settingsJsPath}"><\/script>`);
        document.write(`<script src="${historySearchPath}"><\/script>`);
        
        // Check for tuition class to show the tuition classes button
        document.addEventListener('DOMContentLoaded', function() {
            const tuitionClass = localStorage.getItem('tuitionClass');
            
            // If user belongs to a tuition class, show the tuition classes button
            if (tuitionClass && tuitionClass !== 'null' && tuitionClass !== '') {
                const tuitionClassesBtn = document.getElementById('tuitionClassesBtn');
                if (tuitionClassesBtn) {
                    tuitionClassesBtn.style.display = 'flex';
                }
            }
        });
    </script>
    
    <!-- Active User Tracking Script -->
    <script>
    // Auto-detect server environment and load the appropriate script
    (function() {
        // Determine if we're in production or local
        const isProduction = !(
            window.location.hostname === 'localhost' || 
            window.location.hostname === '127.0.0.1' || 
            window.location.hostname.startsWith('192.168.') ||
            window.location.hostname.includes('.local')
        );
        
        // Get the base path (main folder detection)
        const getBasePath = () => {
            const pathParts = window.location.pathname.split('/');
            if (pathParts.length > 1 && pathParts[1] === 'main') {
                return '/main';
            }
            return '';
        };
        
        // Construct the correct script URL based on environment
        const basePath = getBasePath();
        const scriptPath = isProduction 
            ? '/active-users/js/tracker.js' 
            : basePath + '/active-users/js/tracker.js';
        
        // Create and append the script element
        const script = document.createElement('script');
        script.src = scriptPath;
        script.async = true;
        
        // Add the script to the document
        document.body.appendChild(script);
    })();
    </script>
    <!-- End Active User Tracking Script -->

    <!-- Styles for tuition classes button -->
    <style>
        /* Styling for the tuition classes button */
        #tuitionClassesBtn {
            align-items: center;
            justify-content: space-between;
            color: inherit;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        
        #tuitionClassesBtn:hover {
            background-color: rgba(65, 102, 245, 0.1);
        }
        
        #tuitionClassesBtn i.fas.fa-school {
            font-size: 18px;
            margin-right: 12px;
            color: #4166f5;
        }
    </style>
</body>
</html>

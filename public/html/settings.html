<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <button class="new-chat-btn">
                    <i class="fas fa-plus"></i> New Chat
                </button>
                
                <nav class="sidebar-nav">
                    <a href="chatbot.html" class="nav-button">
                        <i class="fas fa-robot"></i>
                        <span>Chat Bot</span>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </a>
                    <a href="saved_answers.html" class="nav-button">
                        <i class="fas fa-bookmark"></i>
                        <span>Saved Answers</span>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </a>
                </nav>
                
                <div class="chat-history">
                    <div class="history-header">
                        <h3>Chat History</h3>
                    </div>

                    <div class="chat-history-redirect">
                        <p>View your chat history in the Chatbot section</p>
                        <a href="chatbot.html" class="history-redirect-btn">
                            <i class="fas fa-history"></i>
                            Go to Chat History
                        </a>
                    </div>
                </div>
                
                <div class="sidebar-bottom">
                    <a href="settings.html" class="settings-btn active">
                        <i class="fas fa-cog"></i>
                        Settings
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="settings-container">
            <div class="chat-header">
                <button id="menuToggle" class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h2><i class="fas fa-cog"></i> Settings</h2>
            </div>

            <!-- Settings Form -->
            <div class="settings-content">
                <div class="auth-container">
                    <!-- Profile Settings Box -->
                    <div class="auth-box">
                        <div class="auth-header">
                            <i class="fas fa-user-cog"></i>
                            <h1>Profile Settings</h1>
                            <p>Manage your account settings</p>
                        </div>
                        
                        <div id="error-message" class="error-message">
                            <i class="fas fa-exclamation-circle"></i>
                            <span class="error-text"></span>
                        </div>
                        
                        <form class="auth-form" id="settingsForm">
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Full Name</label>
                                <input type="text" id="name" name="name" placeholder="Your full name" disabled required>
                            </div>

                            <div class="form-group">
                                <label><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" id="email" name="email" placeholder="Your email" disabled required>
                            </div>

                            <div class="form-group">
                                <label for="grade-level">
                                    <i class="fas fa-graduation-cap"></i>
                                    Grade Level
                                </label>
                                <select class="form-input" id="grade-level" name="grade" disabled required>
                                    <!-- Dynamic options will be inserted here -->
                                </select>
                            </div>

                            <button type="button" id="editButton" class="auth-button">
                                <i class="fas fa-edit"></i> Edit Profile
                            </button>

                            <button type="submit" id="saveButton" class="auth-button" style="display: none;">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                        </form>
                    </div>

                    <!-- Password Change Box -->
                    <div class="auth-box">
                        <div class="auth-header">
                            <i class="fas fa-lock"></i>
                            <h1>Change Password</h1>
                            <p>Update your account password</p>
                        </div>
                        
                        <div id="password-error" class="error-message">
                            <i class="fas fa-exclamation-circle"></i>
                            <span class="error-text"></span>
                        </div>
                        
                        <form class="auth-form" id="passwordForm">
                            <div class="form-group">
                                <label><i class="fas fa-lock"></i> Current Password</label>
                                <input type="password" id="currentPassword" required>
                            </div>
                            
                            <div class="form-group" id="newPasswordGroup" style="display: none;">
                                <label><i class="fas fa-key"></i> New Password</label>
                                <input type="password" id="newPassword">
                            </div>
                            
                            <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                                <label><i class="fas fa-key"></i> Confirm New Password</label>
                                <input type="password" id="confirmNewPassword">
                            </div>

                            <button type="submit" class="auth-button">
                                <i class="fas fa-sync-alt"></i> Change Password
                            </button>
                        </form>
                    </div>

                    <!-- Logout Box -->
                    <div class="auth-box">
                        <div class="auth-header">
                            <i class="fas fa-sign-out-alt"></i>
                            <h1>Account Actions</h1>
                        </div>
                        <button class="auth-button logout-button" id="logoutButton">
                            <i class="fas fa-power-off"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/settings.js"></script>
    <script src="../js/history-search.js"></script>
</body>
</html>

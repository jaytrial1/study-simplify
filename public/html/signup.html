<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Check if we're on a local server (using a different variable name than base-url.js)
        const _isLocalServer = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname.includes('192.168.') || 
                            window.location.hostname.includes('10.0.');
        
        console.log("Server detection (inline):", _isLocalServer ? "LOCAL SERVER" : "PRODUCTION SERVER");
        
        // CSS path - choosing between local path and production path
        const cssPath = _isLocalServer ? "../css/auth.css" : "/public/css/auth.css";
        console.log("CSS Path:", cssPath);
        
        // JS path - choosing between local path and production path
        const baseUrlJsPath = _isLocalServer ? "../js/base-url.js" : "/public/js/base-url.js";
        const signupJsPath = _isLocalServer ? "../js/signup.js" : "/public/js/signup.js";
        
        // Create and append CSS link
        document.write(`<link rel="stylesheet" href="${cssPath}">`);
        document.write(`<script src="${baseUrlJsPath}"><\/script>`);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot - Sign Up</title>
    <!-- PWA Support -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#4166d5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>document.write(`<link rel="apple-touch-icon" href="${iconPath}">`)</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="fas fa-book-reader"></i>
                <h1>Create Account</h1>
                <p>Sign up to start using ChatBot</p>
            </div>
            
            <div id="error-message" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span class="error-text"></span>
            </div>
            
            <form class="auth-form" id="signupForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>
                
                <div class="form-group">
                    <label for="grade-level">
                        <i class="fas fa-graduation-cap"></i>
                        Grade Level
                    </label>
                    <select class="form-input" id="grade-level" name="grade" required>
                        <!-- Dynamic options will be inserted here -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="auth-button">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>
    <script>
        // Load the JavaScript file using the determined path
        document.write(`<script src="${signupJsPath}"><\/script>`);
    </script>
    
    <!-- Active User Tracking Script -->
    <script>
    // Auto-detect server environment and load the appropriate script
    (function() {
        // Determine if we're in production or local
        const isProduction = !(
            window.location.hostname === 'localhost' || 
            window.location.hostname === '127.0.0.1' || 
            window.location.hostname.startsWith('192.168.') ||
            window.location.hostname.includes('.local')
        );
        
        // Get the base path (main folder detection)
        const getBasePath = () => {
            const pathParts = window.location.pathname.split('/');
            if (pathParts.length > 1 && pathParts[1] === 'main') {
                return '/main';
            }
            return '';
        };
        
        // Construct the correct script URL based on environment
        const basePath = getBasePath();
        const scriptPath = isProduction 
            ? '/active-users/js/tracker.js' 
            : basePath + '/active-users/js/tracker.js';
        
        // Create and append the script element
        const script = document.createElement('script');
        script.src = scriptPath;
        script.async = true;
        
        // Add the script to the document
        document.body.appendChild(script);
    })();
    </script>
    <!-- End Active User Tracking Script -->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Check if we're on a local server
        const isLocalServer = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname.includes('192.168.') || 
                            window.location.hostname.includes('10.0.');
        
        console.log("Server detection:", isLocalServer ? "LOCAL SERVER" : "PRODUCTION SERVER");
        
        // Resource paths - choosing between local path and production path
        const baseUrlJsPath = isLocalServer ? "../js/base-url.js" : "/public/js/base-url.js";
        const manifestPath = isLocalServer ? "../manifest.json" : "/public/manifest.json";
        const iconPath = isLocalServer ? "../icons/icon-192x192.png" : "/public/icons/icon-192x192.png";
        
        // CSS paths
        const stylesPath = isLocalServer ? "../css/styles.css" : "/public/css/styles.css";
        const responsePath = isLocalServer ? "../css/response.css" : "/public/css/response.css";
        const ansActionPath = isLocalServer ? "../css/ans_action.css" : "/public/css/ans_action.css";
        const toastPath = isLocalServer ? "../css/toast.css" : "/public/css/toast.css";
        
        // JavaScript paths
        const scriptPath = isLocalServer ? "../js/script.js" : "/public/js/script.js";
        const historySearchPath = isLocalServer ? "../js/history-search.js" : "/public/js/history-search.js";
        const transitionsPath = isLocalServer ? "../js/transitions.js" : "/public/js/transitions.js";
        const chatHistoryPath = isLocalServer ? "../js/chat-history.js" : "/public/js/chat-history.js";
        const answerActionPath = isLocalServer ? "../js/answer-action-popup.js" : "/public/js/answer-action-popup.js";
        
        // Create and append base URL script
        document.write(`<script src="${baseUrlJsPath}"><\/script>`);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>ChatBot UI</title>
    <!-- PWA Support -->
    <script>document.write(`<link rel="manifest" href="${manifestPath}">`)</script>
    <meta name="theme-color" content="#4166d5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>document.write(`<link rel="apple-touch-icon" href="${iconPath}">`)</script>
    <!-- CSS Files -->
    <script>
        document.write(`<link rel="stylesheet" href="${stylesPath}">`);
        document.write(`<link rel="stylesheet" href="${responsePath}">`);
        document.write(`<link rel="stylesheet" href="${ansActionPath}">`);
        document.write(`<link rel="stylesheet" href="${toastPath}">`);
    </script>
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        // Authentication check
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            const userId = localStorage.getItem('user_id');
            
            // If no token or user ID exists, redirect to login page
            if (!token || !userId) {
                window.location.href = 'login.html';
            }
            
            // Service worker is now handled in base-url.js
        });
    </script>
</head>
<body>
    <!-- PWA Splash Screen -->
    <div class="splash-screen" id="splash-screen">
        <div class="splash-logo">
            <i class="fas fa-robot"></i>
        </div>
        <div class="splash-text">Study Assistant</div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <button class="new-chat-btn">
                    <i class="fas fa-plus"></i> New Chat
                </button>
                
                <nav class="sidebar-nav">
                    <a href="index.html" class="nav-button active">
                        <i class="fas fa-robot"></i>
                        <span>Chat Bot</span>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </a>
                    <a href="saved_answers.html" class="nav-button">
                        <i class="fas fa-bookmark"></i>
                        <span>Saved Answers</span>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </a>

                </nav>
                
                <div class="chat-history">
                    <div class="history-header">
                        <h3>Chat History</h3>
                        <button class="search-toggle">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>

                    <div class="history-search-panel">
                        <div class="search-container">
                            <input type="text" placeholder="Search chats..." class="history-search">
                            <button class="filter-toggle">
                                <i class="fas fa-filter"></i>
                            </button>
                        </div>
                        
                        <div class="history-filters">
                            <select class="subject-filter">
                                <option value="">All Subjects</option>
                            </select>
                            <select class="chapter-filter">
                                <option value="">All Chapters</option>
                            </select>
                            <button class="clear-filters-btn" title="Clear all filters">
                                <a>Clear All Filter</a>
                            </button>
                        </div>
                    </div>

                    <div class="history-items">
                        <!-- Chat history will be loaded dynamically -->
                    </div>
                </div>
                
                <div class="sidebar-bottom">
                    <a href="settings.html" class="settings-btn">
                        <i class="fas fa-cog"></i>
                        Settings
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-container">
            <div class="chat-header">
                <button id="menuToggle" class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h2><i class="fas fa-graduation-cap"></i> Study Assistant</h2>
            </div>
            <div class="mobile-header">
                <div class="dropdown-trigger" id="dropdownTrigger">
                    <i class="fas fa-book-open"></i>
                    <div class="selected-values">
                        <span id="selectedSubject">Select Subject</span>
                        <span id="selectedChapter">Select Chapter</span>
                    </div>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="dropdown-panel" id="dropdownPanel">
                    <div class="dropdown-search">
                        <input type="text" placeholder="Search..." class="search-input">
                    </div>
                    <div class="dropdown-section">
                        <div class="dropdown-header">
                            <h4>Subjects</h4>
                            <span class="item-count">3</span>
                        </div>
                        <div class="dropdown-items subject-list">
                            <!-- Sorted subjects will be added here dynamically -->
                        </div>
                    </div>
                    <div class="dropdown-section">
                        <div class="dropdown-header">
                            <h4>Chapters</h4>
                            <span class="item-count">5</span>
                        </div>
                        <div class="dropdown-items chapter-list">
                            <!-- Sorted chapters will be added here dynamically -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be added here dynamically -->
            </div>
            <div class="chat-input">
                <div id="selectedQuestionsContainer"></div>
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="Type '/' to select a topic..." rows="1"></textarea>
                    <button id="sendButton">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="command-panel" id="commandPanel">
                    <div class="command-list">
                        <!-- Questions will be added here dynamically -->
                    </div>
                </div>
            </div>
            <div class="toast-notification" id="toastNotification">
                <span id="toastMessage"></span>
            </div>
        </div>

        <!-- Toast Message Container -->
        <div id="toast-container"></div>
    </div>
    
    <script>
        // Load JavaScript files using the determined paths
        document.write(`<script src="${scriptPath}"><\/script>`);
        document.write(`<script src="${historySearchPath}"><\/script>`);
        document.write(`<script src="${transitionsPath}"><\/script>`);
        document.write(`<script src="${chatHistoryPath}"><\/script>`);
        document.write(`<script src="${answerActionPath}"><\/script>`);
    </script>
    <script>
        // Handle splash screen
        document.addEventListener('DOMContentLoaded', function() {
            // Show splash screen only when launched as PWA
            if (window.matchMedia('(display-mode: standalone)').matches) {
                const splashScreen = document.getElementById('splash-screen');
                // Hide splash screen after 2 seconds
                setTimeout(() => {
                    splashScreen.classList.add('hidden');
                    // Remove from DOM after animation completes
                    setTimeout(() => {
                        splashScreen.remove();
                    }, 500);
                }, 2000);
            } else {
                // Not in PWA mode, remove splash immediately
                document.getElementById('splash-screen').remove();
            }
        });
    </script>
</body>
</html>

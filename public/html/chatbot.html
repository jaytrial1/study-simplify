    <script>
        // Configure marked.js with proper settings
        document.addEventListener('DOMContentLoaded', function() {
            // Set options for marked to ensure consistent rendering
            marked.setOptions({
                renderer: new marked.Renderer(),
                highlight: function(code, lang) {
                    try {
                        return hljs.highlight(code, { language: lang || 'plaintext' }).value;
                    } catch (e) {
                        console.warn('Language not supported for highlighting:', lang);
                        return hljs.highlight(code, { language: 'plaintext' }).value;
                    }
                },
                pedantic: false,
                gfm: true,
                breaks: true,
                sanitize: false,
                smartLists: true,
                smartypants: false,
                xhtml: false
            });
            
            // Add a custom renderer for code blocks to better handle fenced code blocks
            const renderer = new marked.Renderer();
            
            // Override the code block renderer
            renderer.code = function(code, language) {
                // Ensure code is a string
                const codeStr = typeof code === 'string' ? code : String(code || '');
                
                // Handle triple backtick fences within the content
                if (codeStr.startsWith('```') && (codeStr.match(/```/g) || []).length >= 2) {
                    // Extract just the code contents without the backticks
                    const codeMatch = codeStr.match(/```(?:(\w+)\n)?([\s\S]*?)```/);
                    if (codeMatch) {
                        const extractedLang = codeMatch[1] || language || 'plaintext';
                        const extractedCode = codeMatch[2].trim();
                        
                        try {
                            const highlighted = hljs.highlight(extractedCode, { 
                                language: extractedLang || 'plaintext'
                            }).value;
                            
                            return `<pre><code class="hljs language-${extractedLang}">${highlighted}</code></pre>`;
                        } catch (e) {
                            console.warn('Error highlighting nested code:', e);
                        }
                    }
                }
                
                // Normal code highlighting
                let highlighted;
                try {
                    highlighted = hljs.highlight(codeStr, { 
                        language: language || 'plaintext'
                    }).value;
                } catch (e) {
                    console.warn('Language not supported:', language);
                    highlighted = hljs.highlight(codeStr, { language: 'plaintext' }).value;
                }
                
                return `<pre><code class="hljs language-${language || 'plaintext'}">${highlighted}</code></pre>`;
            };
            
            // Set the custom renderer
            marked.setOptions({ renderer: renderer });
            
            console.log('Marked.js has been properly initialized with custom options');
        });
    </script>

        // Function to periodically check if the user still has access rights
        function setupPeriodicAccessCheck(userId, tuitionClass, token) {
            // First check after 2 minutes, then every 5 minutes after that
            setTimeout(() => {
                checkUserAccess(userId, tuitionClass, token);
                
                // Then set up recurring checks every 5 minutes
                setInterval(() => {
                    checkUserAccess(userId, tuitionClass, token);
                }, 5 * 60 * 1000); // 5 minutes
            }, 2 * 60 * 1000); // 2 minutes
        }
        
        // Function to check if user still has access
        async function checkUserAccess(userId, tuitionClass, token) {
            console.log("Performing periodic access check...");
            
            try {
                const currentHostname = window.location.hostname;
                const isSubdomain = currentHostname.includes('.studysimplify.in') && 
                                   currentHostname !== 'studysimplify.in';
                
                // Skip check if not on a subdomain
                if (!isSubdomain) return;
                
                // Determine API endpoint
                const protocol = window.location.protocol;
                const apiEndpoint = `${protocol}//studysimplify.in/api/user/check_status.php`;
                
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        tuition_class: tuitionClass
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log("Periodic access check result:", data);
                    
                    // Check if user has lost access
                    if (data.is_approved_by_owner != 1 || data.is_active_by_owner != 1 || data.is_active_by_admin != 1) {
                        console.log("Access has been revoked. Redirecting to tuition home page...");
                        
                        // Update localStorage with current status
                        localStorage.setItem('is_approved_by_owner', data.is_approved_by_owner);
                        localStorage.setItem('is_active_by_owner', data.is_active_by_owner);
                        localStorage.setItem('is_active_by_admin', data.is_active_by_admin);
                        
                        // Show a message to the user
                        const toastMessage = document.getElementById('toastMessage');
                        const toastNotification = document.getElementById('toastNotification');
                        
                        if (toastMessage && toastNotification) {
                            toastMessage.textContent = "Your access has been deactivated. Redirecting...";
                            toastNotification.classList.add('show');
                            
                            // Redirect after showing toast
                            setTimeout(() => {
                                window.location.href = 'tuition_home.html';
                            }, 3000);
                        } else {
                            // If toast elements not found, redirect immediately
                            window.location.href = 'tuition_home.html';
                        }
                    }
                } else {
                    console.log("Periodic access check failed with status:", response.status);
                    // Don't redirect on failed checks - might be temporary network issues
                }
            } catch (error) {
                console.error("Error in periodic access check:", error);
                // Don't redirect on failed checks - might be temporary network issues
            }
        }
    </script>

    <script>
    // Auto-detect server environment and load the appropriate script
    (function() {

        const isProduction = !(
            window.location.hostname === 'localhost' || 
            window.location.hostname === '127.0.0.1' || 
            window.location.hostname.startsWith('192.168.') ||
            window.location.hostname.includes('.local')
        );
        
        // Get the base path (main folder detection)
        const getBasePath = () => {
            const pathParts = window.location.pathname.split('/');
            if (pathParts.length > 1 && pathParts[1] === 'main') {
                return '/main';
            }
            return '';
        };
        
        // Construct the correct script URL based on environment
        const basePath = getBasePath();
        const scriptPath = isProduction 
            ? '/active-users/js/tracker.js' 
            : basePath + '/active-users/js/tracker.js';
        
        // Create and append the script element
        const script = document.createElement('script');
        script.src = scriptPath;
        script.async = true;
        
        // Add the script to the document
        document.body.appendChild(script);
    })();
    </script>

                const iconElement = document.querySelector('.chat-header h2 i.fas.fa-graduation-cap');
                if (iconElement) {
                    console.log(`Chatbot Page: Subdomain (${subdomainName}) detected. Replacing header icon with logo: ${logoUrl}`);
                    // Create the image element
                    const imgElement = document.createElement('img');
                    imgElement.src = logoUrl;
                    imgElement.alt = `${subdomainName} Logo`;
                    imgElement.classList.add('chat-header-logo'); // Apply CSS class
                    // Basic error handling: hide if logo not found
                    imgElement.onerror = function() { 
                        console.warn(`Header logo not found for subdomain ${subdomainName} at ${logoUrl}. Hiding image.`);
                        this.style.display = 'none'; 
                    };
                    
                    // Replace the icon with the image
                    iconElement.replaceWith(imgElement);
                } else {
                    console.log('Chatbot Page: Subdomain detected, but default header icon not found.');
                }

                // --- Handle Title Replacement ---
                console.log(`Chatbot Page: Fetching title from ${titleUrl}`);
                fetch(titleUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(titleText => {
                        const titleElement = document.querySelector('.chat-header-title-text');
                        if (titleElement) {
                            titleElement.textContent = titleText.trim();
                            console.log(`Chatbot Page: Header title set to "${titleText.trim()}"`);
                        } else {
                            console.warn('Chatbot Page: Title span element (.chat-header-title-text) not found.');
                        }
                    })
                    .catch(error => {
                        console.warn(`Chatbot Page: Failed to fetch or set title from ${titleUrl}. Error: ${error}. Keeping default title.`);
                    });

            } else {
                console.log('Chatbot Page: Not on a subdomain. Keeping default header icon and title.');
            }
        })();
    </script>
